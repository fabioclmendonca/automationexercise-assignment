name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t automationexercise-tests .

      # api + chromium only, for a fast CI gate; the full cross-browser
      # suite (firefox/webkit included) can still be run on demand via
      # `docker run automationexercise-tests npm test`.
      - name: Run typecheck and tests in container
        run: |
          mkdir -p playwright-report
          docker run --rm -e CI=true \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            automationexercise-tests \
            sh -c "npm run typecheck && npm run test:container"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
